server {
    listen 80;

    # SPA: estaticos, con fallback a index.html para el router del front
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Todo lo que llegue a /api se reenvia al backend por la red interna
    # de compose. El nombre "backend" resuelve porque nginx corre DENTRO
    # de esa red, y al ser same-origin para el browser, evita CORS.
    #
    # El nombre va en una variable (no en el proxy_pass directo) para que
    # nginx lo resuelva recien cuando llega un pedido, no al arrancar --
    # si no, se niega a levantar si el backend todavia no existe.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:8080;

    location /api/ {
        proxy_pass $backend_api;
    }
}
